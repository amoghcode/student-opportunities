notes: >-
  Applicants use participating PRAYAS or Advance PRAYAS Centres. The March
  2026 guidelines state that a centre may not require equity or IP ownership
  as a condition of grant support. Regular centres may approve up to INR 20
  lakh; eligible deep-tech projects at Advance Centres may receive up to INR
  40 lakh. Awards and amounts remain subject to committee approval.
