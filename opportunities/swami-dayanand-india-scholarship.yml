eligibility_summary: First-year full-time professional undergraduates in India for 2026-27,
  with at least 80% in Class XII, annual family income at most INR 12 lakh, and the relevant
  entrance-exam threshold. Eligible degrees include engineering, medicine, dentistry, nursing,
  pharmacy, architecture and veterinary science. A gap/drop year after Class XII is not eligible.
  Shortlisted applicants may face assessment and document verification.
