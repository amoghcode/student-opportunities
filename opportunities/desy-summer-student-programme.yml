eligibility_summary: The reviewed 2026 call requires at least three years of university study
  by summer, continuing university enrolment for the entire placement, English and basic computing
  skills. Intended for students approaching a bachelor's degree or enrolled in a master's; those
  with a completed master's are excluded. No previous DESY summer participation. Students enrolled
  at Russian or Belarusian universities are excluded regardless of citizenship.
