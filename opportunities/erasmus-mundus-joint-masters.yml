  - recent-graduate
fields: []
eligibility_summary: >-
  Applicants must hold a bachelor's degree or be in the final year of bachelor
  studies and graduate before the master's programme starts. A formally
  recognized equivalent level of learning may also qualify. Each consortium
  sets its own programme-specific requirements.
tags:
  - international
