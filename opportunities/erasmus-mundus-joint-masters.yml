id: erasmus-mundus-joint-masters
name: Erasmus Mundus Joint Masters
organization: European Commission
categories:
  - scholarship
official_url: https://erasmus-plus.ec.europa.eu/opportunities/individuals/students/erasmus-mundus-joint-masters
application_url: https://www.eacea.ec.europa.eu/scholarships/erasmus-mundus-catalogue_en
description: >-
  International master's programmes jointly designed and delivered by higher
  education institutions in multiple countries. Students apply directly to a
  programme consortium, and some programmes offer full scholarships to their
  best-ranked applicants.

geographies:
  - scope: global
    values: []
