notes: Each online assignment lasts at most twelve weeks and up to twenty hours per week. This
  is not UN employment, an internship contract or formal UN Volunteer status. New assignments
  have their own deadlines; platform registration does not guarantee placement. Select online,
  not on-site, assignments on the official platform.
