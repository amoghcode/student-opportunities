eligibility_summary: Indian students in recognized Indian universities, in their penultimate
  year with at least 60% in the last qualifying exam. Eligible technical degrees include specified
  BE/BTech, ME/MTech, MSc and MCA/DOEACC B-level programmes. LLB is eligible for the specified
  internet/gaming policy areas; economics/statistics bachelor's students for Digital Economy.
  Final-semester students and those graduating in summer 2026 are excluded by the reviewed call.
