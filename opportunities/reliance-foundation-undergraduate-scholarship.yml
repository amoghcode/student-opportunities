eligibility_summary: Resident Indian citizens enrolled in the first year of a regular full-time
  undergraduate degree in 2026-27, with at least 60% in Class XII and household income below
  INR 15 lakh. The aptitude test is mandatory. Second-year or later students, non-regular study
  modes, post-Class-X diploma routes, and two- or six-year undergraduate courses are excluded.
