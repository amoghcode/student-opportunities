eligibility_summary: >-
  For the 2027 India cohort, applicants must be Indian nationals aged at least
  18, enrolled full time in a BE, BTech, or combined undergraduate-master's
  programme at an institution on Mitacs' published AICTE eligibility list,
  have at least 70%, meet the remaining-study rules, and be available for a
  twelve-week placement. IIT students are not eligible for the 2027 cohort.
