eligibility_summary: Nationals of CERN Member or Associate Member States who have completed
  at least 18 months of study by selection, remain full-time students throughout the placement,
  and have English or French proficiency. PhD students and holders are excluded. Country recruitment
  ceilings may restrict eligibility; the current programme page lists Pakistan, Lithuania, Latvia,
  Cyprus, Croatia and Turkey as excluded.
