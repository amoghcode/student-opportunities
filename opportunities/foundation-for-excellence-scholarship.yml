eligibility_summary: New applicants must be first-year students in BE/BTech, integrated five-year
  dual-degree MTech, MBBS or eligible LLB programmes, with qualifying school exams passed after
  2024. Gross annual family income must be below INR 4 lakh. Admission route and general/common
  entrance-rank cutoffs vary by exam and state; financial verification is required. Lateral-entry
  diploma students, BArch and BDS are excluded.
