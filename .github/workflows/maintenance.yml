name: Dataset maintenance

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/check_freshness.py
      # A failure raises a visible workflow alert. It never edits dataset files;
      # maintainers still confirm the link manually before changing a record.
      - run: python scripts/check_links.py --fail-on-broken
